name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # The last tagged release (22.5.0) is from 2022; the HACS docs use @main.
        uses: hacs/action@main
        with:
          category: plugin
